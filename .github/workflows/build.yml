name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KC_KEYSTORE_B64: ${{ secrets.KC_KEYSTORE_B64 }}
      KC_KS_PASS: ${{ secrets.KC_KS_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Stable signing key if present
        run: |
          if [ -n "$KC_KEYSTORE_B64" ] && [ -n "$KC_KS_PASS" ]; then
            echo "$KC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kc.jks"
            echo "KC_KEYSTORE=$RUNNER_TEMP/kc.jks" >> "$GITHUB_ENV"
          fi
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kcast-apk
          path: app/build/outputs/apk/debug/app-debug.apk
